<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Academy — Living Fantasy Grotto Animated Background</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020617;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Seamless Animated Camera Container */
  .viewport-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene-container {
    position: absolute;
    width: 100%;
    height: 100%;
    animation: cinematicPushIn 10s ease-in-out infinite alternate;
    transform-origin: 52% 46%;
  }

  @keyframes cinematicPushIn {
    0% {
      transform: scale(1.0) translate(0px, 0px);
    }
    100% {
      transform: scale(1.045) translate(-6px, -4px);
    }
  }

  /* Base Fantasy Image */
  .base-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    filter: brightness(0.98) contrast(1.02);
  }

  /* Water Ripple Canvas */
  #waterCanvas {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 48%;
    z-index: 2;
    mix-blend-mode: soft-light;
    pointer-events: none;
    opacity: 0.65;
  }

  /* Particle & Effects Canvas */
  #effectsCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  /* Volumetric Rays Overlay */
  .godrays-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    background: radial-gradient(circle at 28% 18%, rgba(254, 240, 138, 0.18) 0%, rgba(254, 240, 138, 0.05) 45%, transparent 70%);
    mix-blend-mode: screen;
    pointer-events: none;
    animation: rayBreathe 6s ease-in-out infinite alternate;
  }

  @keyframes rayBreathe {
    0% { opacity: 0.7; transform: scale(1); }
    100% { opacity: 1.0; transform: scale(1.03); }
  }

  /* Lantern Pulse Overlays */
  .lantern-glow {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: screen;
    z-index: 4;
    animation: lanternFlicker 3.5s ease-in-out infinite alternate;
  }
  .lantern-1 { top: 22%; left: 11%; width: 140px; height: 140px; background: radial-gradient(circle, rgba(251, 191, 36, 0.35) 0%, transparent 70%); animation-delay: 0.2s; }
  .lantern-2 { top: 18%; left: 16%; width: 160px; height: 160px; background: radial-gradient(circle, rgba(251, 191, 36, 0.4) 0%, transparent 70%); animation-delay: 0.7s; }
  .lantern-3 { top: 20%; right: 16%; width: 150px; height: 150px; background: radial-gradient(circle, rgba(251, 191, 36, 0.42) 0%, transparent 70%); animation-delay: 1.1s; }
  .lantern-4 { top: 31%; right: 11%; width: 130px; height: 130px; background: radial-gradient(circle, rgba(251, 191, 36, 0.35) 0%, transparent 70%); animation-delay: 0.4s; }
  .lantern-5 { top: 48%; left: 34%; width: 120px; height: 120px; background: radial-gradient(circle, rgba(251, 191, 36, 0.38) 0%, transparent 70%); animation-delay: 1.4s; }
  .lantern-6 { top: 51%; right: 34%; width: 120px; height: 120px; background: radial-gradient(circle, rgba(251, 191, 36, 0.38) 0%, transparent 70%); animation-delay: 0.9s; }

  @keyframes lanternFlicker {
    0% { opacity: 0.7; transform: scale(0.95); }
    30% { opacity: 0.95; transform: scale(1.05); }
    60% { opacity: 0.8; transform: scale(0.98); }
    100% { opacity: 1.0; transform: scale(1.08); }
  }

  /* Optional HUD / Overlay Info */
  .control-badge {
    position: absolute;
    bottom: 24px;
    right: 28px;
    z-index: 10;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 10px 18px;
    border-radius: 9999px;
    color: #f8fafc;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    user-select: none;
    transition: opacity 0.3s;
  }
  .control-badge:hover { opacity: 0.4; }
  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
    animation: livePulse 2s infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
</style>
</head>
<body>

<div class="viewport-wrapper">
  <div class="scene-container">
    <!-- Base Reference Image -->
    <img class="base-image" src="assets/fantasy_grotto.jpg" alt="Living Fantasy Grotto">

    <!-- Volumetric Light Rays -->
    <div class="godrays-overlay"></div>

    <!-- Glowing Lantern Hotspots -->
    <div class="lantern-glow lantern-1"></div>
    <div class="lantern-glow lantern-2"></div>
    <div class="lantern-glow lantern-3"></div>
    <div class="lantern-glow lantern-4"></div>
    <div class="lantern-glow lantern-5"></div>
    <div class="lantern-glow lantern-6"></div>

    <!-- Animated Water Ripples Canvas -->
    <canvas id="waterCanvas"></canvas>

    <!-- Animated Particle & Mist Canvas -->
    <canvas id="effectsCanvas"></canvas>
  </div>

  <div class="control-badge">
    <div class="pulse-dot"></div>
    RC Academy • Living Fantasy Grotto (Seamless 60fps Loop)
  </div>
</div>

<script>
  // ---------------------------------------------------------------------------
  // Canvas Resizing & Management
  // ---------------------------------------------------------------------------
  const waterCanvas = document.getElementById('waterCanvas');
  const wCtx = waterCanvas.getContext('2d');

  const effectsCanvas = document.getElementById('effectsCanvas');
  const eCtx = effectsCanvas.getContext('2d');

  let width = window.innerWidth;
  let height = window.innerHeight;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    
    waterCanvas.width = width;
    waterCanvas.height = Math.floor(height * 0.48);

    effectsCanvas.width = width;
    effectsCanvas.height = height;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------------------
  // 1. Water Ripples & Reflections Physics Engine
  // ---------------------------------------------------------------------------
  let waterTime = 0;
  function drawWaterRipples() {
    const wH = waterCanvas.height;
    wCtx.clearRect(0, 0, width, wH);

    waterTime += 0.035;

    // Draw multi-layered glowing caustic ripple bands
    for (let y = 0; y < wH; y += 4) {
      const depthFactor = (y / wH); // 0 at horizon, 1 at bottom
      const waveAmplitude = 3 + depthFactor * 8;
      const waveSpeed = waterTime * (1.2 + depthFactor * 0.8);

      wCtx.beginPath();
      wCtx.lineWidth = 1.5 + depthFactor * 2.5;
      
      const cyanGlow = Math.sin(y * 0.04 + waveSpeed) * 0.5 + 0.5;
      const goldReflect = Math.cos(y * 0.03 - waveSpeed * 0.8) * 0.5 + 0.5;
      
      const r = Math.floor(45 + goldReflect * 60);
      const g = Math.floor(180 + cyanGlow * 60);
      const b = Math.floor(210 + cyanGlow * 45);
      const alpha = 0.04 + depthFactor * 0.12 * cyanGlow;

      wCtx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;

      for (let x = 0; x < width; x += 15) {
        const offset = Math.sin(x * 0.015 + waveSpeed + y * 0.03) * waveAmplitude +
                       Math.cos(x * 0.03 - waveSpeed * 0.5) * (waveAmplitude * 0.4);
        if (x === 0) {
          wCtx.moveTo(x, y + offset);
        } else {
          wCtx.lineTo(x, y + offset);
        }
      }
      wCtx.stroke();
    }
  }

  // ---------------------------------------------------------------------------
  // 2. Fireflies, Waterfall Spray & Mist Particle Engine
  // ---------------------------------------------------------------------------
  const FIREFLY_COUNT = 65;
  const WATERFALL_PARTICLE_COUNT = 140;
  const MIST_COUNT = 25;

  class Firefly {
    constructor() {
      this.reset(true);
    }
    reset(initial = false) {
      this.x = Math.random() * width;
      this.y = initial ? Math.random() * height : height + 10;
      this.size = Math.random() * 2.8 + 1.2;
      this.vx = (Math.random() - 0.5) * 0.45;
      this.vy = -(Math.random() * 0.35 + 0.15);
      this.pulse = Math.random() * Math.PI * 2;
      this.pulseSpeed = Math.random() * 0.04 + 0.02;
      this.hue = Math.random() > 0.3 ? (45 + Math.random() * 15) : (165 + Math.random() * 25); // Gold or Aqua
      this.opacityMax = Math.random() * 0.55 + 0.35;
    }
    update() {
      this.x += this.vx + Math.sin(this.pulse) * 0.3;
      this.y += this.vy;
      this.pulse += this.pulseSpeed;

      if (this.y < -20 || this.x < -20 || this.x > width + 20) {
        this.reset();
      }
    }
    draw(ctx) {
      const currentAlpha = (Math.sin(this.pulse) * 0.5 + 0.5) * this.opacityMax;
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 95%, 68%, ${currentAlpha})`;
      ctx.shadowBlur = this.size * 5;
      ctx.shadowColor = `hsla(${this.hue}, 100%, 75%, ${currentAlpha})`;
      ctx.fill();
      ctx.restore();
    }
  }

  class WaterfallSparkle {
    constructor() {
      this.reset(true);
    }
    reset(initial = false) {
      // Centered around waterfall arch coordinates (~50% width, 30% to 75% height)
      const centerSpread = (Math.random() - 0.5) * (width * 0.14);
      this.x = width * 0.55 + centerSpread;
      this.y = initial ? height * (0.32 + Math.random() * 0.42) : height * 0.32;
      this.size = Math.random() * 2.2 + 0.8;
      this.vy = Math.random() * 2.8 + 2.0;
      this.vx = (Math.random() - 0.5) * 0.4;
      this.alpha = Math.random() * 0.65 + 0.25;
      this.life = 0;
      this.maxLife = Math.random() * 45 + 35;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life++;
      if (this.y > height * 0.76 || this.life > this.maxLife) {
        this.reset();
      }
    }
    draw(ctx) {
      const progress = this.life / this.maxLife;
      const fadeAlpha = this.alpha * (1 - Math.abs(progress - 0.5) * 2);
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(215, 255, 255, ${fadeAlpha})`;
      ctx.shadowBlur = 6;
      ctx.shadowColor = 'rgba(165, 243, 252, 0.8)';
      ctx.fill();
      ctx.restore();
    }
  }

  class MistPuff {
    constructor() {
      this.reset(true);
    }
    reset(initial = false) {
      this.x = width * 0.54 + (Math.random() - 0.5) * (width * 0.35);
      this.y = height * 0.68 + (Math.random() - 0.5) * (height * 0.12);
      this.radius = Math.random() * 80 + 60;
      this.vx = (Math.random() - 0.5) * 0.2;
      this.vy = -(Math.random() * 0.15 + 0.05);
      this.alpha = 0;
      this.maxAlpha = Math.random() * 0.08 + 0.04;
      this.life = 0;
      this.maxLife = Math.random() * 180 + 120;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life++;
      if (this.life < this.maxLife * 0.3) {
        this.alpha = (this.life / (this.maxLife * 0.3)) * this.maxAlpha;
      } else {
        this.alpha = (1 - (this.life / this.maxLife)) * this.maxAlpha;
      }
      if (this.life >= this.maxLife) {
        this.reset();
      }
    }
    draw(ctx) {
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
      grad.addColorStop(0, `rgba(224, 242, 254, ${this.alpha})`);
      grad.addColorStop(0.6, `rgba(224, 242, 254, ${this.alpha * 0.5})`);
      grad.addColorStop(1, 'rgba(224, 242, 254, 0)');
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Initialize Particle Sets
  const fireflies = Array.from({ length: FIREFLY_COUNT }, () => new Firefly());
  const sparkles = Array.from({ length: WATERFALL_PARTICLE_COUNT }, () => new WaterfallSparkle());
  const mists = Array.from({ length: MIST_COUNT }, () => new MistPuff());

  // ---------------------------------------------------------------------------
  // 3. Main 60FPS Render Loop
  // ---------------------------------------------------------------------------
  function animate() {
    // 1. Update Water
    drawWaterRipples();

    // 2. Clear & Update Particle Overlay
    eCtx.clearRect(0, 0, width, height);

    // Draw Soft Mist
    mists.forEach(m => { m.update(); m.draw(eCtx); });

    // Draw Waterfall Cascades
    sparkles.forEach(s => { s.update(); s.draw(eCtx); });

    // Draw Glowing Fireflies
    fireflies.forEach(f => { f.update(); f.draw(eCtx); });

    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
